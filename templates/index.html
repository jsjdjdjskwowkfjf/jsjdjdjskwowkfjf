{% extends "base.html" %}

{% block content %}

<div class="banner">
    <img src="{{ url_for('static', filename='banner.jpg') }}">
</div>

<h2>Produtos</h2>

<div class="produtos">

{% for p in produtos %}

<div class="produto">
<h3>{{p.nome}}</h3>
<p>R$ {{p.preco}}</p>

<a href="/add/{{p.id}}">Comprar</a>

</div>

{% endfor %}

</div>

{% endblock %}
